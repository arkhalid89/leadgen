services:
  api:
    build:
      context: .
      target: api
    container_name: leadgen-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LEADGEN_SECRET_KEY: ${LEADGEN_SECRET_KEY:?set LEADGEN_SECRET_KEY in .env}
      LEADGEN_ALLOWED_ORIGINS: ${LEADGEN_ALLOWED_ORIGINS:-http://localhost:3600}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      # Each detail worker is a Chromium process; raise only with memory to spare.
      LEADGEN_GMAPS_DETAIL_WORKERS: ${LEADGEN_GMAPS_DETAIL_WORKERS:-4}
    volumes:
      - leadgen-data:/app/data
      - leadgen-output:/app/output
    # Chromium needs more than Docker's default 64 MB of shared memory.
    shm_size: 1gb

  web:
    build:
      context: .
      target: frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: leadgen-web
    restart: unless-stopped
    ports:
      - "3600:3600"
    depends_on:
      - api

volumes:
  leadgen-data:
  leadgen-output:
